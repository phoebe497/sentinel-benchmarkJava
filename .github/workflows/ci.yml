name: CI and SAST

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m sentinel_benchmark.indexer
      - run: python scripts/analyze.py baseline
      - run: python scripts/analyze.py run --provider fake --limit 99 --tag ci-full
      - run: python scripts/analyze.py evaluate --fake-tag ci-full
      # Ground truth is joined here and only here: after the reports are on
      # disk. The number this produces is the deterministic provider's, not the
      # LLM's, so it is checked for being *produced*, not for being good.
      - run: python scripts/analyze.py score --tag ci-full
      # The DAST branch has no gateway in CI, so the run is offline and the
      # verdicts stay pre-probe. What this proves is that the case harness still
      # matches cases to reports and writes a well-formed metrics artifact.
      - run: python scripts/analyze.py run --provider fake --dataset dast --tag ci-dast
      - run: python scripts/analyze.py eval-cases --sast-tag ci-full --dast-tag ci-dast
      - run: python -m pytest -q
      - name: No secret or absolute local path in the artifacts this run produced
        run: python scripts/security/artifact_hygiene.py

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "semgrep>=1.100,<2"
      - name: Scan first 100 BenchmarkJava cases
        run: >-
          semgrep scan
          --config p/security-audit
          --metrics off
          --sarif
          --output semgrep.sarif
          vendor/BenchmarkJava/src/main/java/org/owasp/benchmark/testcode/BenchmarkTest00{001..100}.java
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep-benchmarkjava-first100

  # DAST counterpart of the semgrep job: a real ZAP baseline scan against a real
  # running Juice Shop. It is not on `pull_request` on purpose — it takes several
  # minutes and boots a deliberately vulnerable application, so it runs on main
  # and on demand rather than on every proposed change.
  dast:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      # Juice Shop publishes no port, in CI as in the lab: ZAP reaches it on the
      # internal network, nothing else can.
      - name: Start the application under test
        run: docker compose up -d --wait juice-shop
      - name: ZAP baseline scan (passive, AJAX spider on)
        run: bash scripts/stack.sh scan
      - name: Normalize the alerts and check the manifest matches the evidence
        run: |
          python -m sentinel_benchmark.indexer
          python - <<'PY'
          import json, pathlib
          manifest = json.loads(pathlib.Path("artifacts/week-6/dast/manifest.json").read_text(encoding="utf-8"))
          alerts = manifest["output"]["alerts"]
          # A scan that finds nothing is a broken scan, not a clean application:
          # this app is deliberately vulnerable (AGENTS.md 3).
          assert alerts > 0, f"ZAP reported {alerts} alerts against Juice Shop, which means the scan did not run"
          print(json.dumps({"run_id": manifest["run_id"], "alerts": alerts, "scanner": manifest.get("scanner")}, ensure_ascii=False))
          PY
      - name: Analyse the alerts offline (no gateway in CI, so no probing)
        run: python scripts/analyze.py run --provider fake --dataset dast --tag ci-dast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline
          path: |
            artifacts/week-6/dast/zap-baseline.json
            artifacts/week-6/dast/zap-baseline.html
            artifacts/week-6/dast/manifest.json
      - name: Stop the stack
        if: always()
        run: docker compose down -v
