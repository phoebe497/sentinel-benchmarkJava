[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-benchmark-java"
version = "0.1.0"
description = "BenchmarkJava scanner evaluation and security finding knowledge base"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
